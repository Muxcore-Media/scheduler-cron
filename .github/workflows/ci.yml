name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  GOPRIVATE: github.com/Muxcore-Media/*
jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core dependency
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
      - name: Prepare workspace layout
        run: |
          mkdir -p scheduler-cron
          shopt -s dotglob
          for item in *; do
            case "$item" in core|scheduler-cron) continue ;; esac
            mv "$item" scheduler-cron/
          done
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - working-directory: ./scheduler-cron
        run: go vet ./...

  test:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core dependency
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
      - name: Prepare workspace layout
        run: |
          mkdir -p scheduler-cron
          shopt -s dotglob
          for item in *; do
            case "$item" in core|scheduler-cron) continue ;; esac
            mv "$item" scheduler-cron/
          done
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - working-directory: ./scheduler-cron
        run: |
          go test -count=1 -timeout 10m ./...
          CORE_DIR="$GITHUB_WORKSPACE/core" go test -tags=integration -count=1 -timeout 5m ./test/

  build:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core dependency
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
      - name: Prepare workspace layout
        run: |
          mkdir -p scheduler-cron
          shopt -s dotglob
          for item in *; do
            case "$item" in core|scheduler-cron) continue ;; esac
            mv "$item" scheduler-cron/
          done
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - working-directory: ./scheduler-cron
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...

  docker:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: self-hosted
    needs: [lint, test, build]
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout core dependency
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
      - name: Prepare workspace layout for Docker
        run: |
          mkdir -p scheduler-cron
          shopt -s dotglob
          for item in *; do
            case "$item" in core|scheduler-cron) continue ;; esac
            mv "$item" scheduler-cron/
          done
      - uses: docker/setup-buildx-action@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scheduler-cron/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
