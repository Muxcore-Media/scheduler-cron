services:
  core:
    image: ghcr.io/muxcore-media/core:latest
    ports:
      - "9090:9090"
      - "8080:8080"
    environment:
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  scheduler-cron:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9200:9200"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: scheduler-cron
      SCHEDULER_HTTP_ADDR: ":9200"
      SCHEDULER_STORE_PATH: /var/lib/scheduler-cron/tasks.json
      SCHEDULER_API_TOKEN: dev-scheduler-token
    volumes:
      - scheduler-data:/var/lib/scheduler-cron
    depends_on:
      core:
        condition: service_healthy

volumes:
  scheduler-data:
